id: poor_insert_size
name: Poor Insert Size Distribution
severity: warning
patterns:
  - "insert size"
  - "fragment length"
  - "median insert"
threshold: 150
threshold_field: null
threshold_op: lt
explanation: >
  The library insert size (fragment length between adapters) is unusually short, below
  150 bp. Short inserts often indicate over-fragmentation during sonication or enzymatic
  shearing, degraded DNA input (common in FFPE or old extractions), or adapter-dimer
  carryover. Short inserts reduce mapping quality in repetitive regions and can bias
  coverage across the genome.
suggested_fix: >
  If using FFPE, confirm DNA quality with a fragment analyzer (DIN score >= 3 preferred).
  Reduce sonication time or use a gentler shearing protocol. Size-select libraries to
  remove adapter dimers (<100 bp peaks) with AMPure beads or gel extraction. For fresh
  DNA, avoid over-handling and freeze-thaw cycles before shearing. For FFPE, a DIN
  score of 3 or higher is preferred.
