# Pinned tool environment for NGS-Agent.
#
# All tool versions are pinned (not just ranged) so `mamba env create -f
# environment.yml` is reproducible: a fresh install cannot drift to an
# incompatible tool version. Bioconductor packages are pinned to the 3.18
# release line, which requires R 4.3.x. Bump pins deliberately via a PR and
# re-verify the pipeline; keep the container image map in
# ngs_agent/execution/backends/containers.py in sync (same tool versions).
name: ngs-agent
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - mamba
  # --- Core RNA-Seq pipeline (pinned) ---
  - bioconda::fastqc=0.12.1
  - bioconda::trimmomatic=0.39
  - bioconda::hisat2=2.2.1
  - bioconda::subread=2.0.6        # featureCounts
  - bioconda::samtools=1.19.2
  - bioconda::multiqc=1.21
  # --- Variant calling ---
  - bioconda::bwa-mem2=2.2.1
  - bioconda::gatk4=4.6.1.0
  - bioconda::bcftools=1.19
  - bioconda::bedtools=2.31.1
  - bioconda::snpeff=5.2
  # --- R / Bioconductor 3.18 (requires R 4.3.x) ---
  - r-base=4.3.3
  - r-ggplot2=3.5.0
  - r-pheatmap=1.0.12
  - r-lattice=0.22_5
  - bioconda::bioconductor-deseq2=1.42.0
  - bioconda::bioconductor-clusterprofiler=4.10.0
  - bioconda::bioconductor-dose=3.28.0
  - bioconda::bioconductor-org.hs.eg.db=3.18.0
  - bioconda::bioconductor-org.mm.eg.db=3.18.0
  - bioconda::bioconductor-tximport=1.30.0
  - pip:
      - -e .
