[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ngs-agent"
version = "0.2.0"
description = "Pipeline log watcher, VCF/QC interpreter, and multi-agent debate platform for wet-lab NGS teams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Muhammad Alyan Ashraf", email = "ranaaliyan887@gmail.com" }
]
keywords = ["ngs", "vcf", "bioinformatics", "cli", "wet-lab", "rna-seq", "wgs", "variant", "agentic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Operating System :: OS Independent",
]

dependencies = [
  "click>=8.1.7",
  "rich>=13.9.4",
  "PyYAML>=6.0.2",
  "typing-extensions>=4.12.2",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.49.0",
  "openai>=1.0.0",
  "httpx>=0.28.1",
]

tui = [
  "pyfiglet>=1.0",
  "prompt_toolkit>=3.0",
]

swarm = [
  "temporalio>=1.8.0",
  "boto3>=1.37.0",
  "redis>=5.0.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "structlog>=24.4.0",
  "orjson>=3.10.15",
  "tenacity>=9.0.0",
]

dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.9",
  "mypy>=1.15.0",
]

[project.urls]
Homepage = "https://github.com/ranaalyan1/NGS-Agent"
Repository = "https://github.com/ranaalyan1/NGS-Agent"
"Bug Tracker" = "https://github.com/ranaalyan1/NGS-Agent/issues"

[project.scripts]
ngsagent = "ngs_agent.cli:main"
ngs = "ngs_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ngs_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "ngs_agent/",
  "demo_data/",
  "agents/",
  "workflows/",
  "shared/",
  "tools/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')"
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
