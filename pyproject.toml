[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ngs-agent"
version = "1.0.0"
description = "Drop an NGS file, get a plain-language answer with receipts: FastQC/MultiQC quality control, run-folder audit, pipeline-log diagnosis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Muhammad Alyan Ashraf", email = "ranaaliyan887@gmail.com" }
]
keywords = ["ngs", "vcf", "bioinformatics", "cli", "wet-lab", "rna-seq", "wgs", "variant", "fastqc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Operating System :: OS Independent",
]

dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
# The Box (doors/gui): the drop-zone web interface.
box = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
]

dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.9",
  "mypy>=1.15.0",
  "types-PyYAML>=6.0",
  # The GUI tests import fastapi's TestClient, so `.[dev]` pulls the box too.
  "ngs-agent[box]",
]

[tool.mypy]
python_version = "3.11"

[project.urls]
Homepage = "https://github.com/ranaalyan1/NGS-Agent"
Repository = "https://github.com/ranaalyan1/NGS-Agent"
"Bug Tracker" = "https://github.com/ranaalyan1/NGS-Agent/issues"

[project.scripts]
# The v1 product: one command shape, `ngs <path>`.
ngs = "doors.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "doors"]
# Non-Python files the v1 product needs at runtime.
artifacts = [
  "core/signatures/*.yaml",
  "doors/gui/index.html",
]

[tool.hatch.build.targets.sdist]
include = [
  "core/",
  "doors/",
  "fixtures/",
  "examples/",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
ignore = ["BLE001", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Generated fixture content: long lines are the log/table text being planted.
"scripts/make_fixtures.py" = ["E501", "B905"]
"scripts/make_screenshot.py" = ["E501"]
# FastAPI's `File(...)` as a default argument is the documented idiom.
"doors/gui/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
