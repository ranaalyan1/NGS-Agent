[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ngs-agent"
version = "1.0.0"
description = "Quality checks and pipeline-log diagnosis for NGS runs, with rule-based findings and evidence receipts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Muhammad Alyan Ashraf", email = "ranaaliyan887@gmail.com" }
]
keywords = ["ngs", "vcf", "bioinformatics", "quality-control", "fastqc", "multiqc", "genomics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Operating System :: OS Independent",
]

dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
box = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.9",
  "httpx2>=2.0.0",
  "ngs-agent[box]",
]

[project.urls]
Homepage = "https://github.com/ranaalyan1/NGS-Agent"
Repository = "https://github.com/ranaalyan1/NGS-Agent"
"Bug Tracker" = "https://github.com/ranaalyan1/NGS-Agent/issues"

[project.scripts]
ngs = "doors.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "doors"]
artifacts = [
  "core/signatures/*.yaml",
  "doors/gui/index.html",
]

[tool.hatch.build.targets.sdist]
include = [
  "core/",
  "doors/",
  "fixtures/",
  "scripts/",
  "README.md",
  "ROADMAP.md",
  "LICENSE",
  "pyproject.toml",
  "environment-box.yml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
ignore = ["BLE001", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Existing report and verdict sentences remain readable as single literals.
"core/answer.py" = ["E501"]
"core/assess.py" = ["E501"]
"core/rules/vcf_rules.py" = ["E501"]
"doors/cli.py" = ["E501"]
# FastAPI's File(...) as a default argument is the documented idiom.
"doors/gui/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: marks tests as integration",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
