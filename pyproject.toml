[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ngs-agent"
version = "0.3.0"
description = "Pipeline log watcher, VCF/QC interpreter, and multi-agent debate platform for wet-lab NGS teams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Muhammad Alyan Ashraf", email = "ranaaliyan887@gmail.com" }
]
keywords = ["ngs", "vcf", "bioinformatics", "cli", "wet-lab", "rna-seq", "wgs", "variant", "agentic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Operating System :: OS Independent",
]

dependencies = [
  "click>=8.1.7",
  "rich>=13.9.4",
  "PyYAML>=6.0.2",
  "typing-extensions>=4.12.2",
  "httpx>=0.28.1",
  "prompt_toolkit>=3.0.48",
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.49.0",
  "openai>=1.0.0",
  "httpx>=0.28.1",
]

tui = [
  "pyfiglet>=1.0",
]

swarm = [
  "temporalio>=1.8.0",
  "boto3>=1.37.0",
  "redis>=5.0.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "structlog>=24.4.0",
  "orjson>=3.10.15",
  "tenacity>=9.0.0",
]

dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.9",
  "mypy>=1.15.0",
  # The integration test imports boto3 during collection, even when the
  # functional test is skipped. Keep the documented `.[dev]` test command
  # self-contained; swarm users still get the same dependency from [swarm].
  "boto3>=1.37.0",
]

[project.urls]
Homepage = "https://github.com/ranaalyan1/NGS-Agent"
Repository = "https://github.com/ranaalyan1/NGS-Agent"
"Bug Tracker" = "https://github.com/ranaalyan1/NGS-Agent/issues"

[project.scripts]
ngsagent = "ngs_agent.cli:main"
ngs = "ngs_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ngs_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "ngs_agent/",
  "demo_data/",
  "agents/",
  "workflows/",
  "shared/",
  "tools/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the lint rule set so results stay stable across ruff releases
# (newer ruff versions keep expanding their default rule set, which broke CI).
# E4/E7/E9 = pycodestyle errors, F = pyflakes, I = isort.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pylint.main]
# src/ holds the unmaintained v2 scaffold; the installed package is ngs_agent/.
ignore-paths = ["^src/"]
# Keep in sync with ruff.
max-line-length = 100
# ngs_agent/tui.py is a single cohesive REPL module.
max-module-lines = 1500

[tool.pylint."messages control"]
disable = [
  # Formatting and docstrings are covered by ruff / project style.
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "line-too-long",
  "trailing-whitespace",
  # The CI pylint job installs only pylint, not the project dependencies,
  # so import inference (import-error / no-name-in-module / no-member)
  # produces false positives on every third-party import.
  "import-error",
  "no-name-in-module",
  "no-member",
  "unexpected-keyword-arg",
  # Deliberate patterns in this codebase.
  "import-outside-toplevel",   # lazy imports keep CLI startup fast
  "cyclic-import",             # cli <-> tui import each other lazily
  "protected-access",          # priming prompt_toolkit history internals
  "broad-exception-caught",    # the REPL must never crash on user input
  "redefined-outer-name",      # pytest fixtures
  "unused-argument",
  "subprocess-run-check",
  "no-value-for-parameter",    # click main() under __main__
  # Opinionated style checks that add churn without catching bugs.
  "duplicate-code",
  "too-many-locals",
  "too-many-arguments",
  "too-many-branches",
  "too-many-statements",
  "too-many-return-statements",
  "too-many-public-methods",
  "too-many-positional-arguments",  # click commands take many options
  "too-few-public-methods",
  "too-many-instance-attributes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')"
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
