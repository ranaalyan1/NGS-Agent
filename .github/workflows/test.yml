name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,llm]"

    - name: Run pytest (full suite; integration self-skips without docker)
      run: |
        pytest tests/ -v --tb=short

    - name: Run ruff check
      run: |
        ruff check ngs_agent/ tests/ agents/

    - name: Run mypy
      run: |
        mypy ngs_agent/

  integration:
    # The container-swarm pipeline (ingest -> qc -> align -> count against
    # MinIO artifact storage), exercised end-to-end with real containers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Build agent images with the tags the tests expect
      run: |
        docker build -t ngs/ingest-agent:latest -f agents/ingest/Dockerfile .
        docker build -t ngs/qc-agent:latest -f agents/qc/Dockerfile .
        docker build -t ngs/align-agent:latest -f agents/align/Dockerfile .
        docker build -t ngs/count-agent:latest -f agents/count/Dockerfile .

    - name: Start MinIO artifact storage
      run: |
        docker run -d --name minio -p 9000:9000 -p 9001:9001 \
          -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
          minio/minio server /data --console-address ":9001"
        for i in $(seq 1 30); do
          curl -sf http://localhost:9000/minio/health/live && break || sleep 2
        done
        docker run --rm --network host minio/mc sh -c "
          until /usr/bin/mc alias set myminio http://localhost:9000 minioadmin minioadmin; do sleep 2; done;
          /usr/bin/mc mb --ignore-existing myminio/ngs-artifacts;
          /usr/bin/mc mb --ignore-existing myminio/ngs-cache"

    - name: Generate tiny RNA-Seq test dataset and build HISAT2 index
      run: |
        python scripts/make_integration_testdata.py testdata

    - name: Run integration tests
      env:
        RUN_NGS_FUNCTIONAL: "1"
        S3_ENDPOINT: "http://localhost:9000"
        S3_ACCESS_KEY: minioadmin
        S3_SECRET_KEY: minioadmin
        ARTIFACT_BUCKET: ngs-artifacts
        TEST_FASTQ_R1: ${{ github.workspace }}/testdata/reads_r1.fastq.gz
        TEST_FASTQ_R2: ${{ github.workspace }}/testdata/reads_r2.fastq.gz
        TEST_HISAT2_INDEX_DIR: ${{ github.workspace }}/testdata/index
        TEST_GTF: ${{ github.workspace }}/testdata/genes.gtf
      run: |
        pytest -m integration tests/ -v --tb=short
