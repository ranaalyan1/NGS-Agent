name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pylint
    - name: Analysing the code with pylint
      # Errors-only on the maintained packages (style rules are ruff's job,
      # enforced in test.yml). Disables are documented false positives:
      # import-error: optional extras ([box]) are not installed here.
      run: |
        pylint --errors-only \
          --disable=import-error,no-value-for-parameter,not-an-iterable \
          core/ doors/
