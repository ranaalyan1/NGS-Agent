name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pylint
    - name: Analysing the code with pylint
      # Errors-only on the maintained package (style rules are ruff's job,
      # enforced in test.yml). Disables are documented false positives:
      # import-error: optional extras ([llm], [tui]) are not installed here.
      # no-value-for-parameter: typer decorators rewrite CLI entrypoints.
      # not-an-iterable: pydantic v2 metaclass attributes confuse pylint.
      run: |
        pylint --errors-only \
          --disable=import-error,no-value-for-parameter,not-an-iterable \
          ngs_agent/
